<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Oficina Bosio</title>
<meta name="description" content="La oficina de bots de Jonathan: quién trabaja, qué entregó y cómo viene cada uno.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Concepto: planta de oficina vista desde arriba, en pixel art (idea tomada de Star-Office-UI): cada bot en su escritorio, la luz del puesto dice si trabajó. */
:root{
  --bg:#efe9df; --floor-a:#e3d8c6; --floor-b:#dccfba; --panel:#fbf8f3; --ink:#2a2420; --muted:#6f655b; --line:#cbbfae;
  --wall:#4a3f36; --desk:#9a6b43; --desk-top:#b98455; --screen:#1d2a33; --glow:#6fe0a8;

}
@media (prefers-color-scheme:dark){:root{--bg:#1d1916;--floor-a:#2a241f;--floor-b:#26201b;--panel:#231e1a;--ink:#efe6da;--muted:#a99d90;--line:#3d342d;--wall:#0f0c0a;--desk:#6e4a2d;--desk-top:#8a5d39;--screen:#0c1318;--accent:#e2774e;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 24px;margin-bottom:14px}
h1{font-family:var(--f-pixel);font-size:34px;margin:0;letter-spacing:.5px;line-height:1}
.sub{color:var(--muted);margin:4px 0 0}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.stat{background:var(--panel);border:2px solid var(--line);padding:6px 10px;font-family:var(--f-pixel);font-size:14px;white-space:nowrap}
.stat b{font-size:18px}
.banner{border:2px dashed var(--warn);background:color-mix(in srgb,var(--warn) 12%,var(--panel));padding:10px 14px;margin-bottom:14px}
.layout{display:grid;grid-template-columns:1fr 330px;gap:16px;align-items:start}
@media(max-width:980px){.layout{grid-template-columns:1fr}}
/* organigrama */
.org{display:flex;flex-direction:column;align-items:center;gap:0;margin-bottom:14px}
.boss{background:var(--wall);color:#f6efe4;padding:10px 16px;font-family:var(--f-pixel);display:flex;gap:12px;align-items:center;border:3px solid #000;box-shadow:4px 4px 0 rgba(0,0,0,.25);cursor:pointer;max-width:100%}
.boss small{display:block;font-family:var(--f-body);opacity:.8;font-size:12.5px}
.trunk{width:4px;height:16px;background:var(--wall)}
.branches{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;border-top:4px solid var(--wall);padding-top:8px;max-width:100%}
.branch{font-family:var(--f-pixel);font-size:13px;padding:3px 8px;border:2px solid var(--wall);background:var(--panel)}
/* planta */
.floor{background-color:var(--floor-a);background-image:linear-gradient(45deg,var(--floor-b) 25%,transparent 25%,transparent 75%,var(--floor-b) 75%),linear-gradient(45deg,var(--floor-b) 25%,transparent 25%,transparent 75%,var(--floor-b) 75%);background-size:32px 32px;background-position:0 0,16px 16px;border:6px solid var(--wall);padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.room{border:4px solid var(--rc);background:color-mix(in srgb,var(--rc) 8%,transparent);padding:30px 10px 10px;position:relative;min-width:0}
.room h2{position:absolute;top:-4px;left:-4px;margin:0;background:var(--rc);color:#fff;font-family:var(--f-pixel);font-size:14px;padding:3px 10px;font-weight:500}
.desks{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.desk{background:none;border:0;padding:0;cursor:pointer;text-align:center;color:inherit;font:inherit;position:relative}
.scene{height:84px;position:relative;margin:0 auto;width:100px;image-rendering:pixelated}
.table{position:absolute;bottom:8px;left:6px;right:6px;height:22px;background:var(--desk);border-top:6px solid var(--desk-top);box-shadow:0 4px 0 rgba(0,0,0,.18)}
.monitor{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);width:34px;height:22px;background:var(--screen);border:3px solid #111}
.monitor::after{content:"";position:absolute;bottom:-9px;left:12px;width:4px;height:6px;background:#111}
.desk.st-ok .monitor{background:color-mix(in srgb,var(--glow) 55%,var(--screen));box-shadow:0 0 12px var(--glow)}
.desk.st-bad .monitor{background:#5a1712;box-shadow:0 0 10px var(--bad)}
.person{position:absolute;bottom:22px;left:14px;width:20px;height:30px}
.person .head{width:14px;height:14px;background:#e8b98f;margin:0 auto;border:2px solid #3a2a1e;position:relative}
.person .head::before{content:"";position:absolute;top:-2px;left:-2px;right:-2px;height:5px;background:var(--hair,#3a2a1e)}
.person .body{width:20px;height:14px;background:var(--rc);border:2px solid #222;margin-top:-1px}
.desk.st-ok .person,.desk.st-run .person{animation:type .6s steps(2) infinite}

.desk.st-idle .person,.desk.st-pause .person{opacity:.55;left:auto;right:6px;bottom:0}
.bubble{position:absolute;top:0;right:4px;font-family:var(--f-pixel);font-size:12px;background:var(--panel);border:2px solid var(--ink);padding:0 4px;line-height:16px}
.desk.st-bad .bubble{background:var(--bad);color:#fff;border-color:#000}
.desk.st-ok .bubble{background:var(--ok);color:#fff;border-color:#000}
.name{font-weight:700;font-size:13px;line-height:1.2;margin-top:2px;overflow-wrap:anywhere}
.meta{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){.desk .person{animation:none!important}}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:10px 0 0}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px;background:var(--c);border:2px solid #000}
/* columna lateral */
aside{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--panel);border:3px solid var(--wall);padding:12px 14px;box-shadow:4px 4px 0 rgba(0,0,0,.12);min-width:0}
.card h3{font-family:var(--f-pixel);font-size:17px;margin:0 0 8px;font-weight:500}
.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px;max-height:420px;overflow:auto;font-size:13.5px}
.feed time{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px;margin-right:4px}
.feed b{font-weight:700}
.howto ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px}
code{font-family:ui-monospace,Menlo,Consolas,monospace;background:color-mix(in srgb,var(--line) 45%,transparent);padding:0 4px}
/* detalle */
dialog{border:4px solid var(--wall);background:var(--panel);color:var(--ink);padding:0;width:min(760px,calc(100% - 24px));max-height:calc(100% - 24px)}
dialog::backdrop{background:rgba(20,15,10,.55)}
.dhead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;background:var(--wall);color:#f6efe4}
.dhead h2{margin:0;font-family:var(--f-pixel);font-size:20px;font-weight:500}
.dhead button{font:inherit;background:#f6efe4;color:var(--wall);border:2px solid #000;padding:4px 10px;cursor:pointer}
.dbody{padding:14px 16px;display:flex;flex-direction:column;gap:14px;overflow:auto;max-height:calc(100vh - 120px)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.report{border:2px solid var(--line);padding:12px;background:var(--bg);font-size:14px;overflow-wrap:anywhere;max-height:420px;overflow:auto}
.report h1,.report h2,.report h3{font-family:var(--f-pixel);font-size:16px;margin:.6em 0 .3em}
.report ul{padding-left:20px}
.spark{width:100%;height:64px;display:block}
.pill{display:inline-block;font-family:var(--f-pixel);font-size:12.5px;padding:1px 8px;border:2px solid #000;color:#fff;background:var(--c)}
.empty{color:var(--muted);font-style:italic}
</style>
</head>
<body>

  <header>

</div>
