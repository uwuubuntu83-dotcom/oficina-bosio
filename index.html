<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Oficina Bosio</title>
<meta name="description" content="La oficina de bots de Jonathan Bosio: quién trabaja, qué entregó y cómo viene cada uno.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">

<style>
/* Planta de oficina nocturna: salas con borde de neón por área, chips de bot con luz de estado, vista 2D, 3D y organigrama. */
:root{
  --bg:#0b0d14; --bg2:#11141f; --panel:#151926; --panel2:#1b2030; --line:#262c40; --ink:#e9ecf5; --muted:#8c93ab;
  --gold:#f5b942; --ok:#3ddc84; --wait:#f0b04a; --bad:#ff5c5c; --idle:#6b7290; --run:#5cc8ff; --pause:#9aa0b4;
  --f-head:"Sora", system-ui, sans-serif; --f-body:"Inter", system-ui, sans-serif; --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px}
a{color:var(--gold)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1500px;margin:0 auto;padding-block:18px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-family:var(--f-head);font-weight:800;font-size:clamp(26px,3.4vw,38px);margin:0;letter-spacing:-.02em}
h1 span{color:var(--gold)}
.sub{color:var(--muted);margin:4px 0 10px}
.pills{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{font-family:var(--f-mono);font-size:12px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;white-space:nowrap}
.pill b{color:var(--ink)}
.pill.gold{background:var(--ok);color:#06210f;border-color:transparent;font-weight:600}
.banner{margin-top:10px;border:1px solid var(--wait);background:rgba(240,176,74,.08);color:#ffd99a;border-radius:10px;padding:10px 12px;font-size:13px}
.grid{display:grid;grid-template-columns:1fr 380px;gap:16px;margin-top:14px;align-items:stretch}
@media(max-width:1100px){.grid{grid-template-columns:1fr}}
.stage{position:relative;background:radial-gradient(1200px 600px at 50% -10%,#1a1f33 0,var(--bg2) 55%);border:1px solid var(--line);border-radius:18px;overflow:hidden;min-height:620px;height:calc(100vh - 210px);max-height:900px}
@media(max-width:1100px){.stage{height:72vh;min-height:520px}}
.view{position:absolute;inset:0;overflow:auto}
.view[hidden]{display:none}
/* 2D */
#v2d{padding:22px 18px 84px}
.boss{margin:0 auto 18px;width:max-content;max-width:100%;background:linear-gradient(180deg,#2a2412,#1d1a10);border:2px solid var(--gold);border-radius:14px;padding:10px 16px;text-align:center;box-shadow:0 0 0 4px rgba(245,185,66,.08),0 0 40px rgba(245,185,66,.25)}
.boss .tag{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;color:#1b1405;background:var(--gold);border-radius:4px;padding:1px 6px;display:inline-block;margin-bottom:6px}
.boss .nm{font-family:var(--f-head);font-weight:600;font-size:16px}
.boss .act{display:inline-block;margin-top:8px;background:#ff9d2e;color:#1b0f00;border:0;border-radius:8px;padding:6px 12px;font-weight:600;text-decoration:none}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.room{--c:#5cc8ff;position:relative;border:1.5px solid var(--c);border-radius:14px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 10%,transparent),transparent 70%);box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 18%,transparent),0 0 26px color-mix(in srgb,var(--c) 22%,transparent),inset 0 0 30px color-mix(in srgb,var(--c) 8%,transparent);padding:34px 12px 12px;min-width:0}
.room .lbl{position:absolute;top:-12px;left:12px;display:flex;gap:6px;align-items:center;background:var(--bg2);border:1.5px solid var(--c);border-radius:999px;padding:3px 10px;font-family:var(--f-head);font-weight:600;font-size:12.5px;white-space:nowrap;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis}
.room .lbl .n{background:var(--c);color:#0b0d14;border-radius:999px;padding:0 7px;font-size:11px;font-family:var(--f-mono)}
.chips{display:flex;flex-wrap:wrap;gap:10px 8px}
.chip{display:flex;flex-direction:column;align-items:center;gap:0;background:none;border:0;padding:0;max-width:100%}
.chip .tagc{display:flex;align-items:center;gap:6px;background:#0f1220;border:1.5px solid color-mix(in srgb,var(--c) 70%,#fff 0%);border-radius:9px;padding:5px 9px;font-family:var(--f-head);font-weight:600;font-size:12px;white-space:nowrap;max-width:170px;overflow:hidden;text-overflow:ellipsis;box-shadow:0 2px 0 rgba(0,0,0,.4)}
.chip.mgr .tagc{border-color:var(--gold);background:#231d0d;box-shadow:0 0 14px rgba(245,185,66,.35)}
.chip .desk{width:44px;height:10px;margin-top:3px;border-radius:3px;background:linear-gradient(#d8a24a,#9c6b22);box-shadow:0 3px 0 #5a3c10}
.chip:hover .tagc{transform:translateY(-1px);border-color:#fff}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--idle);box-shadow:0 0 0 2px rgba(0,0,0,.35)}
.s-ok .dot{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.s-run .dot{background:var(--run);box-shadow:0 0 8px var(--run);animation:blink 1s infinite}
.s-wait .dot{background:var(--wait)}
.s-bad .dot{background:var(--bad);box-shadow:0 0 8px var(--bad)}
.s-pause .dot{background:var(--pause)}
.s-off .dot{background:transparent;border:2px solid var(--idle)}
@keyframes blink{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.s-run .dot{animation:none}}
.kind{font-size:10px;opacity:.75}
/* organigrama */
#vorg{padding:22px 18px 84px}
.org-top{display:flex;flex-direction:column;align-items:center;gap:0}
.org-node{border-radius:12px;padding:10px 16px;text-align:center;min-width:260px;max-width:100%}
.org-node small{display:block;color:var(--muted);margin-top:2px}
.org-own{border:1.5px solid var(--gold);background:#1e1a0f}
.org-gg{border:1.5px solid var(--ok);background:#0f1f18}
.org-ln{width:2px;height:18px;background:var(--line)}
.org-areas{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-top:14px;border-top:1px solid var(--line);padding-top:14px}
.org-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.org-card h3{margin:0 0 6px;font-family:var(--f-head);font-size:13.5px;background:var(--panel2);border-radius:8px;padding:6px 8px}
.org-card .meta{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-bottom:6px}
.org-bot{display:block;width:100%;text-align:left;background:none;border:0;border-left:2px solid var(--line);padding:4px 0 4px 10px;margin-left:6px}
.org-bot b{font-size:12.5px}
.org-bot .st{font-family:var(--f-mono);font-size:10.5px;border-radius:4px;padding:1px 6px;margin-left:6px;background:var(--panel2);color:var(--muted)}
.org-bot .st.ok{color:var(--ok);background:rgba(61,220,132,.1)}.org-bot .st.bad{color:var(--bad);background:rgba(255,92,92,.1)}.org-bot .st.wait{color:var(--wait);background:rgba(240,176,74,.1)}
.org-bot p{margin:2px 0 0;color:var(--muted);font-size:11.5px;line-height:1.35}
/* 3D */
#v3d canvas{display:block;width:100%;height:100%}
.lab3{position:absolute;transform:translate(-50%,-100%);pointer-events:none;white-space:nowrap;font-family:var(--f-head);font-weight:600;font-size:12px;background:rgba(14,16,26,.86);border:1.5px solid var(--c);border-radius:999px;padding:3px 10px;box-shadow:0 0 14px color-mix(in srgb,var(--c) 40%,transparent)}
.lab3 .n{background:var(--c);color:#0b0d14;border-radius:999px;padding:0 6px;margin-left:5px;font-size:10.5px}
.tip3{position:absolute;pointer-events:none;background:#0f1220;border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12px;transform:translate(-50%,-130%);white-space:nowrap}
.hint3{position:absolute;left:12px;bottom:62px;font-family:var(--f-mono);font-size:11px;color:var(--muted);background:rgba(11,13,20,.7);padding:4px 8px;border-radius:6px}
.fallback3{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);text-align:center;padding:20px}
/* barra de vistas */
.bar{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:6px;flex-wrap:nowrap;max-width:calc(100% - 20px);overflow-x:auto;padding:4px;background:rgba(11,13,20,.7);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(6px)}
.bar button{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:7px 11px;font-family:var(--f-head);font-weight:600;font-size:12.5px;white-space:nowrap}
.bar button[aria-pressed="true"]{background:var(--gold);color:#1b1405;border-color:var(--gold)}
/* chat */
.chat{background:var(--panel);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;min-height:420px;height:calc(100vh - 210px);max-height:900px;overflow:hidden}
@media(max-width:1100px){.chat{height:auto;max-height:none}}
.chat h2{margin:0;padding:12px 14px;font-family:var(--f-head);font-size:15px;text-align:center;border-bottom:1px solid var(--line)}
.msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px;max-height:70vh}
.m{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:9px 11px;font-size:13px;line-height:1.45;overflow-wrap:anywhere}
.m .who{font-weight:600;font-family:var(--f-head);font-size:12.5px}
.m time{display:block;color:var(--muted);font-family:var(--f-mono);font-size:10.5px;margin-top:4px}
.m.rp{border-color:color-mix(in srgb,var(--c) 50%,var(--line))}
.m.rp button{background:none;border:0;color:var(--gold);padding:0;margin-top:4px;font-size:12px}
.quick{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;border-top:1px solid var(--line)}
.quick button,.quick a{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:12px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.compose{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.compose input{flex:1;min-width:0;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--ink);font:inherit}
.compose button{background:var(--ok);color:#06210f;border:0;border-radius:10px;padding:0 14px;font-weight:600}
.compose-note{padding:0 12px 10px;color:var(--muted);font-size:11.5px}
/* modal */
dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:0;width:min(780px,calc(100% - 24px));max-height:calc(100% - 24px)}
dialog::backdrop{background:rgba(5,6,10,.7)}
.dh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.dh h2{margin:0;font-family:var(--f-head);font-size:19px}
.dh button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 12px}
.db{padding:14px 16px;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 140px);overflow:auto}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:13.5px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.rep{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:13.5px;line-height:1.5;max-height:420px;overflow:auto;overflow-wrap:anywhere}
.rep h3{font-family:var(--f-head);font-size:15px;margin:.4em 0}
.rep ul{padding-left:20px}
.badge{display:inline-block;font-family:var(--f-mono);font-size:11.5px;border-radius:6px;padding:2px 8px;background:var(--panel2);border:1px solid var(--line)}
.spark{width:100%;height:64px;display:block}
.empty{color:var(--muted);font-style:italic}
code{font-family:var(--f-mono);background:var(--panel2);border-radius:4px;padding:1px 5px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Oficina <span>Bosio</span></h1>
  <p class="sub">Tus bots trabajando en sus escritorios. Tocá uno para ver qué hace, su último informe y lo que aprendió.</p>
  <div class="pills" id="pills"></div>
  <div id="banner"></div>
  <div class="grid">
    <section class="stage" aria-label="Oficina">
      <div class="view" id="v2d"></div>
      <div class="view" id="v3d" hidden></div>
      <div class="view" id="vorg" hidden></div>
      <div class="bar" id="bar">
        <button data-v="3d" aria-pressed="false">🧊 3D</button>
        <button data-v="2d" aria-pressed="true">🗺️ 2D</button>
        <button data-f="prev" title="Área anterior">◀</button>
        <button data-f="area" id="areaBtn">📂 Por área</button>
        <button data-f="next" title="Área siguiente">▶</button>
        <button data-f="toda" aria-pressed="true">🏢 Toda</button>
        <button data-f="jefes" aria-pressed="false">👔 Jefes</button>
        <button data-v="org" aria-pressed="false">📊 Organigrama</button>
      </div>
    </section>
    <aside class="chat" aria-label="Chat de la oficina">

      <div class="msgs" id="msgs"></div>
      <div class="quick" id="quick"></div>
      <form class="compose" id="compose"><input id="orden" placeholder="Escribile una orden al Gerente general…" aria-label="Orden para el gerente" autocomplete="off"><button>Enviar</button></form>
      <div class="compose-note" id="note">La orden se manda por Telegram: se abre el chat con tu bot y queda copiada para pegar.</div>
    </aside>
  </div>
</div>
<dialog id="dlg" aria-labelledby="dT"><div class="dh"><h2 id="dT"></h2><button id="dX">Cerrar</button></div><div class="db" id="dB"></div></dialog>
