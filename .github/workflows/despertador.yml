name: Instalar buzón

# Instala (o actualiza) el buzón + despertador en Cloudflare. Corre cuando cambia su código, o a mano desde Actions.
on:
  push:
    paths: ["buzon/**", ".github/workflows/despertador.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  instalar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Revisar claves
        id: claves
        env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH: ${{ secrets.DESPERTADOR_TOKEN }}
          TG: ${{ secrets.TELEGRAM_TOKEN }}
          CK0: ${{ secrets.CELU_KEY }}
          PIN0: ${{ secrets.OFICINA_PIN }}
        run: |
          falta=""
          [ -z "$CF" ] && falta="$falta CLOUDFLARE_API_TOKEN"
          [ -z "$GH" ] && falta="$falta DESPERTADOR_TOKEN"
          [ -z "$TG" ] && falta="$falta TELEGRAM_TOKEN"
          if [ -n "$falta" ]; then echo "::warning::Faltan estos secretos:$falta. Cargalos y corré este paso de nuevo."; echo "listo=no" >> "$GITHUB_OUTPUT"; else echo "listo=si" >> "$GITHUB_OUTPUT"; fi
          # La clave del celu y el PIN: si no los cargaste, salen de la clave de Telegram (la oficina te los manda por Telegram).
          CK=$(node -e 'const c=require("crypto");const d=p=>c.createHash("sha256").update(p+":"+process.env.TG).digest("hex");process.stdout.write(process.env.CK0||d("celu").slice(0,32))')
          PIN=$(node -e 'const c=require("crypto");const d=p=>c.createHash("sha256").update(p+":"+process.env.TG).digest("hex");process.stdout.write(process.env.PIN0||String(parseInt(d("pin").slice(0,12),16)%1e8).padStart(8,"0"))')
          echo "::add-mask::$CK"; echo "::add-mask::$PIN"
          { echo "CELU_KEY=$CK"; echo "OFICINA_PIN=$PIN"; } >> "$GITHUB_ENV"
          echo "dueno=$(node -e 'try{process.stdout.write(String(require(process.cwd()+"/data/estado.json").dueno||""))}catch(e){}')" >> "$GITHUB_OUTPUT"
      - name: Subir a Cloudflare
        if: steps.claves.outputs.listo == 'si'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: buzon
          command: deploy --var DUENO:${{ steps.claves.outputs.dueno }}
          secrets: |
            TELEGRAM_TOKEN
            GH_TOKEN
            CELU_KEY
            OFICINA_PIN
            GEMINI_API_KEY
            GROQ_API_KEY
            CEREBRAS_API_KEY
            SAMBANOVA_API_KEY
            OPENROUTER_API_KEY
            NVIDIA_API_KEY
            ZAI_API_KEY
            LLM7_API_KEY
            UPSTAGE_API_KEY
            HF_TOKEN
            COHERE_API_KEY
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          GH_TOKEN: ${{ secrets.DESPERTADOR_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          LLM7_API_KEY: ${{ secrets.LLM7_API_KEY }}
          UPSTAGE_API_KEY: ${{ secrets.UPSTAGE_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
