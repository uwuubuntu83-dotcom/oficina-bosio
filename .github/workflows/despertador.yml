name: Instalar buzón

# Instala (o actualiza) el buzón + despertador en Cloudflare. Corre cuando cambia su código, o a mano desde Actions.
on:
  push:
    paths: ["buzon/**", ".github/workflows/despertador.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  instalar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Revisar claves
        id: claves
        env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH: ${{ secrets.DESPERTADOR_TOKEN }}
          CK: ${{ secrets.CELU_KEY }}
          PIN: ${{ secrets.OFICINA_PIN }}
        run: |
          falta=""
          [ -z "$CF" ] && falta="$falta CLOUDFLARE_API_TOKEN"
          [ -z "$GH" ] && falta="$falta DESPERTADOR_TOKEN"
          [ -z "$CK" ] && falta="$falta CELU_KEY"
          [ -z "$PIN" ] && falta="$falta OFICINA_PIN"
          if [ -n "$falta" ]; then echo "::warning::Faltan estos secretos:$falta. Cargalos y corré este paso de nuevo."; echo "listo=no" >> "$GITHUB_OUTPUT"; else echo "listo=si" >> "$GITHUB_OUTPUT"; fi
          echo "dueno=$(node -e 'try{process.stdout.write(String(require(\"./data/estado.json\").dueno||\"\"))}catch(e){}')" >> "$GITHUB_OUTPUT"
      - name: Subir a Cloudflare
        if: steps.claves.outputs.listo == 'si'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: buzon
          command: deploy --var DUENO:${{ steps.claves.outputs.dueno }}
          secrets: |
            TELEGRAM_TOKEN
            GH_TOKEN
            CELU_KEY
            OFICINA_PIN
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          GH_TOKEN: ${{ secrets.DESPERTADOR_TOKEN }}
          CELU_KEY: ${{ secrets.CELU_KEY }}
          OFICINA_PIN: ${{ secrets.OFICINA_PIN }}
