name: Oficina

on:
  schedule:
    - cron: "7,37 * * * *"   # cada 30 minutos: órdenes de Telegram, bots sin IA y tareas que tocan
  workflow_dispatch:
    inputs:
      modo:
        description: "auto, todos, sinIA, parte, entrenar o correr:ID_DEL_BOT"
        required: false
        default: "auto"

permissions:
  contents: write
  models: read

concurrency:
  group: oficina
  cancel-in-progress: false

jobs:
  trabajar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Abrir la oficina
        env:
          MODO: ${{ github.event.inputs.modo || 'auto' }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          OFICINA_PIN: ${{ secrets.OFICINA_PIN }}   # para hablar con el buzón del celu (Cloudflare)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # IA gratis: cualquiera que tenga su clave cargada entra en la rotación. Se pueden sumar varias claves de Gemini (proyectos distintos).
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_API_KEY_2: ${{ secrets.OPENROUTER_API_KEY_2 }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          LLM_EXTRA_BASE: ${{ secrets.LLM_EXTRA_BASE }}
          LLM_EXTRA_KEY: ${{ secrets.LLM_EXTRA_KEY }}
          LLM_EXTRA_MODELS: ${{ secrets.LLM_EXTRA_MODELS }}
        run: node oficina.mjs
      - name: Guardar lo que hicieron los bots
        run: |
          git config user.name "Oficina Bosio"
          git config user.email "oficina-bosio@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Oficina: $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
