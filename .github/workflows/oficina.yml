name: Oficina

on:
  schedule:
    - cron: "7,37 * * * *"   # cada 30 minutos: revisa órdenes de Telegram y tareas que tocan
  workflow_dispatch:
    inputs:
      modo:
        description: "auto, todos, parte, entrenar o correr:ID_DEL_BOT"
        required: false
        default: "auto"

permissions:
  contents: write

concurrency:
  group: oficina
  cancel-in-progress: false

jobs:
  trabajar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Abrir la oficina
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          MODO: ${{ github.event.inputs.modo || 'auto' }}
        run: node oficina.mjs
      - name: Guardar lo que hicieron los bots
        run: |
          git config user.name "Oficina Bosio"
          git config user.email "oficina-bosio@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Oficina: $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
