name: Probar mi IA (crear)
on:
  push:
    paths: ["pruebas/mi_ia/pedido.txt"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: probar-mi-ia, cancel-in-progress: true }
jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Instalar
        run: pip install -q torch --index-url https://download.pytorch.org/whl/cpu && pip install -q transformers huggingface_hub accelerate requests beautifulsoup4
      - name: Crear la app (cerebro real + internet real)
        working-directory: pruebas/mi_ia
        run: |
          PEDIDO="$(cat pedido.txt)"
          timeout 7800 python -u mi_ia.py crear "$PEDIDO" 2>&1 | tee salida.txt || true
          rm -rf cerebro __pycache__
      - name: Guardar resultado
        run: |
          git config user.name "Prueba mi IA"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pruebas/mi_ia; git commit -qm "Resultado de la prueba de mi IA" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q && break; sleep 5; done
